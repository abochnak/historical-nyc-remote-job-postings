name: Track Simplify Close Times

on:
  schedule:
    # Run daily at 1 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: data

      - name: Checkout scripts from main
        run: |
          git fetch origin main
          git checkout origin/main -- simplify_close_tracker.py backfill_closes_from_simplify.py

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Backfill past postings
        run: python3 backfill_closes_from_simplify.py

      - name: Track future transitions
        run: python3 simplify_close_tracker.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add data/nyc_jobs.csv data/remote_jobs.csv
          [ -f simplify_transitions.csv ] && git add simplify_transitions.csv || true
          [ -f simplify_job_state.json ] && git add simplify_job_state.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Simplify close times"
            git push origin data
          fi
