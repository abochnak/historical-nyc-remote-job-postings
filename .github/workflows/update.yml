name: Update job data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      notify_target:
        description: "Discord channel to post to"
        type: choice
        options: ["test", "prod"]
        required: false
        default: "test"
      commits:
        description: "Number of commits to check (default 5, use 100+ for catch-up)"
        required: false
        default: "5"

# Every workflow that writes the data branch force-pushes it, so they must
# never run concurrently -- two overlapping runs mean one silently wins.
concurrency:
  group: data-branch-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Was 15. The render step adds ~75s, and the first run on a cold cache
    # spends ~2 min downloading the browser.
    timeout-minutes: 25

    permissions:
      contents: write

    steps:
      - name: Checkout main branch (for scraper code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Verify data files exist before running
        run: |
          if [ ! -f "data-branch/data/nyc_jobs.csv" ]; then
            echo "ERROR: data/nyc_jobs.csv missing — aborting to prevent data loss"
            exit 1
          fi
          if [ ! -f "data-branch/data/job_details.csv" ]; then
            echo "ERROR: data/job_details.csv missing — aborting to prevent data loss"
            exit 1
          fi
          echo "Data files verified OK"
          echo "  nyc_jobs.csv: $(wc -l < data-branch/data/nyc_jobs.csv) lines"
          echo "  job_details.csv: $(wc -l < data-branch/data/job_details.csv) lines"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_TEST: ${{ secrets.DISCORD_WEBHOOK_URL_TEST }}
          # A scheduled run has no inputs, so it resolves to prod. A
          # hand-triggered run defaults to test, because a manual run is
          # usually an experiment.
          NOTIFY_TARGET: ${{ github.event.inputs.notify_target || 'prod' }}
        run: |
          cp -r main/scraper data-branch/scraper
          cd data-branch
          COMMITS=${{ github.event.inputs.commits || '5' }}
          echo "Checking last $COMMITS commits"
          python scraper/update.py --commits $COMMITS

      # Postings on Workday, Ashby, Oracle Cloud and iCIMS cannot be read over
      # plain HTTP at all -- update.py's capture step gets 0 characters from
      # them. A browser reads them, and doing it now rather than on a weekly
      # sweep is the whole point: a posting discovered minutes ago is still
      # live. Rendering the historical backlog hits 42%; the failures are
      # expired pages that render "job not found".
      #
      # Cached so the ~150 MB browser is downloaded once, not 48 times a day.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright
        run: |
          pip install -r main/scraper/requirements-render.txt
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # Browser binaries are cached; only the OS deps need installing.
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Render postings plain HTTP could not read
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_TEST: ${{ secrets.DISCORD_WEBHOOK_URL_TEST }}
          # A scheduled run has no inputs, so it resolves to prod. A
          # hand-triggered run defaults to test, because a manual run is
          # usually an experiment.
          NOTIFY_TARGET: ${{ github.event.inputs.notify_target || 'prod' }}
        # Never fail the run over this. The cheap paths have already done their
        # work and been committed by this point; a browser crash or a slow board
        # must not cost the CSV updates.
        continue-on-error: true
        run: |
          cd data-branch
          # Newest first, so fresh postings are attempted before the backlog.
          # 12 per cycle is ~75s at the measured 6s each, and drains the
          # remaining backlog over about a week alongside new arrivals.
          python scraper/render_scrape.py --only-js --limit 12

      - name: Merge Flask edits and amend data branch
        run: |
          cd data-branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch latest remote — picks up any Flask edits made since checkout
          git fetch origin data

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/data)

          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "Flask edits detected on remote — merging into current state"
            # Copy our updated data files to a temp location
            cp -r data/ /tmp/action-data/

            # Reset to latest remote (which has Flask edits)
            git reset --hard origin/data

            # Overwrite with our action-updated files
            # This preserves Flask edits to files the action didn't touch
            # and uses action output for files the action did update
            cp /tmp/action-data/nyc_jobs.csv      data/nyc_jobs.csv
            cp /tmp/action-data/remote_jobs.csv   data/remote_jobs.csv
            cp /tmp/action-data/pending_archive.csv data/pending_archive.csv
            # The Discord announcement ledger. Losing it means every posting
            # queued at the time gets announced a second time.
            cp /tmp/action-data/notified_ids.txt   data/notified_ids.txt 2>/dev/null || true
            # Written by the render step. Losing it means re-attempting pages
            # already known to be unreadable, every cycle, forever.
            cp /tmp/action-data/render_status.csv  data/render_status.csv 2>/dev/null || true
            # Preserve Flask edits to job_details and excluded_jobs
            # by only overwriting if action made changes
            if ! diff -q /tmp/action-data/job_details.csv data/job_details.csv > /dev/null 2>&1; then
              cp /tmp/action-data/job_details.csv data/job_details.csv
            fi
            if ! diff -q /tmp/action-data/excluded_jobs.csv data/excluded_jobs.csv > /dev/null 2>&1; then
              cp /tmp/action-data/excluded_jobs.csv data/excluded_jobs.csv
            fi
            # job_details.jsonl holds the scraped description text. Without this
            # the reset --hard above throws away everything this run scraped
            # whenever a Flask edit landed while the action was working.
            if ! diff -q /tmp/action-data/job_details.jsonl data/job_details.jsonl > /dev/null 2>&1; then
              cp /tmp/action-data/job_details.jsonl data/job_details.jsonl
            fi
          fi

          # Amend the single commit with final merged state
          git add data/
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit --amend --no-edit \
              -m "data: latest job data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push --force origin data
            echo "Data branch updated — Flask edits preserved"
          fi
